name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Windows Zip cleanly
        run: |
          python3 -c "
          import zipfile, os, glob

          zips = glob.glob('*.zip')
          for zname in zips:
              print(f'Processing {zname}...')
              with zipfile.ZipFile(zname, 'r') as z:
                  for member in z.infolist():
                      # Normalize Windows backslashes to Linux forward slashes
                      clean_name = member.filename.replace('\\\\', '/').strip('/')
                      if not clean_name:
                          continue
                      parts = clean_name.split('/')
                      if parts[0] == 'Alfred':
                          parts = parts[1:]
                      if not parts:
                          continue
                      target = os.path.join('.', *parts)
                      if member.is_dir() or member.filename.endswith('/') or member.filename.endswith('\\\\'):
                          os.makedirs(target, exist_ok=True)
                      else:
                          os.makedirs(os.path.dirname(target), exist_ok=True)
                          with open(target, 'wb') as f:
                              f.write(z.read(member.filename))
              print(f'Successfully extracted {zname} with cross-platform paths!')
          "

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK with Gradle
        run: |
          rm -f local.properties
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alfred-JARVIS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
